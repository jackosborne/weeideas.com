{% assign summary = description | default: site.description | strip_html | escape %}
<title>{% if title and page.url != '/' %}{{ title | escape }} — {% endif %}{{ site.title | escape }} — {{ site.tagline | escape }}</title>
<meta name="color-scheme" content="light dark">
<meta name="description" content="{{ summary }}">
<meta property="og:site_name" content="{{ site.title | escape }}">
<meta property="og:title" content="{{ title | default: site.title | escape }}">
<meta property="og:description" content="{{ summary }}">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="website">
<meta property="og:image" content="{{ site.url }}/_/icons/og-1200x630.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<link rel="icon" href="/_/icons/favicon.ico">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e0e">
