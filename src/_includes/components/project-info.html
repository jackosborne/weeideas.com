<div class="info">
  <div>
    {% if date %}<p class="post__date small"><time datetime="{{ date | dateISO }}">{{ date | dateMonth }}</time></p>{% endif %}
    <h1 class="post__title">{{ title | escape }}</h1>
    {% if draft %}<p class="small">Work in progress</p>{% endif %}
  </div>
  <div>{% if description %}<p>{{ description }}</p>{% endif %}</div>
</div>
